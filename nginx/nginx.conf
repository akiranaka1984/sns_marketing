# =============================================================================
# Nginx Reverse Proxy Configuration
# SNS Marketing Automation Platform
#
# Upstream: http://app:3000 (Docker internal network)
# Note: The current docker-compose.yml runs the app on port 5000.
#       Change the upstream port below to match your environment.
#       - Production target : http://app:3000
#       - Local docker-compose: http://app:5000
# =============================================================================

# ---------------------------------------------------------------------------
# Worker settings (auto-detect CPU cores)
# ---------------------------------------------------------------------------
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept       on;
    use                epoll;
}

http {
    # -----------------------------------------------------------------------
    # MIME types and defaults
    # -----------------------------------------------------------------------
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide Nginx version in responses and error pages
    server_tokens off;

    # -----------------------------------------------------------------------
    # Log format
    # -----------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # -----------------------------------------------------------------------
    # Performance
    # -----------------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Max client request body size (file uploads etc.)
    client_max_body_size 50m;

    # -----------------------------------------------------------------------
    # Gzip compression
    # -----------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        text/x-component
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        font/opentype
        image/svg+xml
        image/x-icon;

    # -----------------------------------------------------------------------
    # Upstream: Node.js application container
    # Change the port to match your docker-compose PORT setting.
    # -----------------------------------------------------------------------
    upstream app_backend {
        server app:3000;          # Production target
        # server app:5000;        # Uncomment for local docker-compose (PORT=5000)
        keepalive 32;
    }

    # -----------------------------------------------------------------------
    # WebSocket upgrade map
    # -----------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -----------------------------------------------------------------------
    # Main server block
    # -----------------------------------------------------------------------
    server {
        listen      80;
        server_name _;

        # Access and error logs per virtual host
        access_log /var/log/nginx/access.log main;
        error_log  /var/log/nginx/error.log warn;

        # -------------------------------------------------------------------
        # Security headers
        # -------------------------------------------------------------------
        add_header X-Frame-Options        "SAMEORIGIN"            always;
        add_header X-Content-Type-Options "nosniff"               always;
        add_header X-XSS-Protection       "1; mode=block"         always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # -------------------------------------------------------------------
        # Static file caching (CSS / JS / fonts / images)
        # Matches file extensions that Vite/React emits into /assets/
        # -------------------------------------------------------------------
        location ~* \.(css|js|mjs|woff|woff2|ttf|eot|otf|ico|png|jpg|jpeg|gif|svg|webp|avif|mp4|webm|pdf)$ {
            proxy_pass         http://app_backend;

            # Proxy headers
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # 30-day browser cache for versioned static assets
            expires            30d;
            add_header         Cache-Control "public, max-age=2592000, immutable";

            # Re-add security headers (add_header is not inherited when a
            # nested location block defines its own add_header directives)
            add_header X-Frame-Options        "SAMEORIGIN"            always;
            add_header X-Content-Type-Options "nosniff"               always;
            add_header X-XSS-Protection       "1; mode=block"         always;
        }

        # -------------------------------------------------------------------
        # WebSocket endpoint (Vite HMR and application WS connections)
        # -------------------------------------------------------------------
        location /ws {
            proxy_pass              http://app_backend;

            proxy_http_version      1.1;
            proxy_set_header        Upgrade           $http_upgrade;
            proxy_set_header        Connection        $connection_upgrade;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;

            # Long timeout for persistent WebSocket connections
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
        }

        # -------------------------------------------------------------------
        # All other requests -> Node.js application
        # -------------------------------------------------------------------
        location / {
            proxy_pass              http://app_backend;

            proxy_http_version      1.1;

            # WebSocket support (also needed for SSE / long-poll)
            proxy_set_header        Upgrade           $http_upgrade;
            proxy_set_header        Connection        $connection_upgrade;

            # Standard proxy headers
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;

            # Disable buffering for streaming / SSE responses
            proxy_buffering         off;
            proxy_cache_bypass      $http_upgrade;

            # Timeouts
            proxy_connect_timeout   60s;
            proxy_send_timeout      60s;
            proxy_read_timeout      60s;

            # Security headers (repeated for this location block)
            add_header X-Frame-Options        "SAMEORIGIN"            always;
            add_header X-Content-Type-Options "nosniff"               always;
            add_header X-XSS-Protection       "1; mode=block"         always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        }

        # -------------------------------------------------------------------
        # Health check endpoint (no logging)
        # -------------------------------------------------------------------
        location = /healthz {
            access_log off;
            proxy_pass http://app_backend;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
