<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>SNS Marketing Automation System</title>

    <!-- Fonts: Geist Sans + Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <style>
      /* Preload — match light theme background */
      html {
        background: #F7F8FA;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics: only load when both env vars are configured -->
    <script type="module">
      const endpoint = "%VITE_ANALYTICS_ENDPOINT%";
      const websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
      if (endpoint && !endpoint.includes("%") && websiteId && !websiteId.includes("%")) {
        const s = document.createElement("script");
        s.defer = true;
        s.src = `${endpoint}/umami`;
        s.setAttribute("data-website-id", websiteId);
        document.body.appendChild(s);
      }
    </script>
  </body>

</html>
