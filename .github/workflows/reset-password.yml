name: Reset Admin Password

on:
  workflow_dispatch:

jobs:
  reset:
    name: Reset admin password in DB
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Reset admin_settings table
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e
            echo "Resetting admin password..."
            docker exec $(docker ps -q -f name=sns-marketing-super-db) mysql -u root -p"$( docker exec $(docker ps -q -f name=sns-marketing-super-db) printenv MYSQL_ROOT_PASSWORD )" sns_automation -e "DELETE FROM admin_settings;"
            echo "✅ Admin password reset. Visit the site to set a new password."
          ENDSSH
